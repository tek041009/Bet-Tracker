name: PANNA seven leagues match supplemental sources
# User explicitly rejected expansion to these seven leagues.
# Do not execute until the user authorises a scope change.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  
  source:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        layer: [shot_summary,shot_events,lineups,timed_events,xmetrics_bymatch,advanced_match_stats]
    env:
      PANNA_NEW7_MATCH_LAYER: ${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install DuckDB
        run: python -m pip install -q duckdb
      - name: Verify release bytes and filter exact new-league fixture IDs
        run: python PANNA_NEW7_MATCH_LAYERS_RELAY.py
      - name: Upload original-schema filtered Panna source
        uses: actions/upload-artifact@v4
        with:
          name: panna-new7-layer-${{ matrix.layer }}
          path: panna_new7_match_layers/
          retention-days: 3
          compression-level: 0
