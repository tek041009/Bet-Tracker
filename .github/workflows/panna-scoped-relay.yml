name: PANNA scoped event and xMetrics relay
on:
  push:
    branches:
      - panna-datalayers-20261111
    paths:
      - .github/workflows/panna-scoped-relay.yml
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Parquet reader
        run: python -m pip install --quiet duckdb
      - name: Download and filter verified public Panna sources
        run: python panna_bridge_script.py
      - name: Upload scoped public data and provenance
        uses: actions/upload-artifact@v4
        with:
          name: panna-scoped-shots-lineups-events-xmetrics
          path: filtered/
          retention-days: 2
          compression-level: 0
