name: Deploy Bet Tracker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild exact Bet Tracker HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat deploy/index.xz.b64.part* | base64 --decode > /tmp/index.html.xz
          xz --decompress --stdout /tmp/index.html.xz > _site/index.html
          touch _site/.nojekyll
          test "$(sha256sum _site/index.html | awk '{print $1}')" = "99b5473dc34adc11d20a0974e10a512ee09a9a3fbcbd8d36fa79aa11197e937b"

      - name: Apply cloud sync safety patch
        run: python deploy/cloud-safety-patch.py

      - name: Apply clipboard paste patch
        run: python deploy/clipboard-paste-patch.py

      - name: Apply Import Screenshot paste patch
        run: python deploy/import-screenshot-paste-patch.py

      - name: Apply scanner quality patch
        run: python deploy/scanner-quality-patch.py

      - name: Apply audited scanner regression patch
        run: python deploy/scanner-regression-patch.py

      - name: Apply Multi Bet Import patch
        run: python deploy/multi-bet-import-patch.py

      - name: Apply Paddy Power text import patch
        run: python deploy/paddy-text-import-patch.py

      - name: Apply robust Paddy Super Sub parser
        run: python deploy/paddy-super-sub-parser-fix.py

      - name: Default imported source to My Pick
        run: python deploy/paddy-default-source-patch.py

      - name: Apply Paddy text click isolation fix
        run: python deploy/paddy-text-click-fix.py

      - name: Apply Paddy full review stage
        run: python deploy/paddy-review-patch.py

      - name: Apply explicit Paddy review button fix
        run: python deploy/paddy-review-button-fix.py

      - name: Route Paddy action through review stage
        run: python deploy/paddy-review-routing-fix.py

      - name: Apply Paddy review runtime fix
        run: python deploy/paddy-review-runtime-fix.py

      - name: Apply Paddy review leg columns
        run: python deploy/paddy-review-columns-patch.py

      - name: Apply Paddy batch import progress flow
        run: python deploy/paddy-import-progress-patch.py

      - name: Return batch import result to progress screen
        run: python deploy/paddy-import-wrapper-return-fix.py

      - name: Add Bet365 text paste importer
        run: python deploy/bet365-text-import-patch.py

      - name: Normalize Bet365 markets and European Tour competition
        run: python deploy/bet365-market-competition-normalization-patch.py

      - name: Fix Bet365 review routing
        run: python deploy/bet365-review-route-fix.py

      - name: Apply Bet Tracker bulk delete
        run: python deploy/bulk-delete-patch.py

      - name: Restore labeled and advanced Bet Tracker filters
        run: python deploy/tracker-advanced-filters-patch.py

      - name: Make Advanced open visible controls immediately
        run: python deploy/tracker-advanced-open-fix.py

      - name: Replace generic Advanced with Excel-style tracker filters
        run: python deploy/tracker-advanced-v2-patch.py

      - name: QA Paddy review flow
        run: python deploy/qa-paddy-review.py

      - name: Browser QA Paddy parser and review columns
        run: python deploy/qa-paddy-review-browser.py

      - name: QA Bet365 text paste parser
        run: python deploy/qa-bet365-text-import.py

      - name: QA Bet365 market and competition normalization
        run: python deploy/qa-bet365-market-competition.py

      - name: Browser QA Bet365 review routing
        run: python deploy/qa-bet365-review-browser.py

      - name: Browser QA bulk delete and import progress
        run: python deploy/qa-bulk-import-flow-v3.py

      - name: Browser QA Shift-click bulk selection
        run: python deploy/qa-bulk-shift-select.py

      - name: Browser QA labeled and advanced tracker filters
        run: python deploy/qa-advanced-filters.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
