name: Bowen clean source recovery
on:
  push:
    branches:
      - bowen-clean-source-20261001

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Install open source tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q playwright
          python -m playwright install chromium
      - name: Resolve official WHU streams
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          entries=[
            ("0_5vlzy6vn",80,22,"01_PRAGUE_COLD_OPEN_CLEAN.mp4"),
            ("0_fwe57njw",318,18,"02_NEWCASTLE_DECLINE_CLEAN.mp4"),
            ("0_h0y2r4yq",78,26,"03_LEEDS_GOAL_CLEAN.mp4"),
            ("0_i46e409j",526,14,"04_LEEDS_FULLTIME_CLEAN.mp4"),
            ("0_xua2rsv6",61,9,"05_RELEGATION_INTERVIEW_CLEAN.mp4"),
            ("0_var7kzmh",0,10,"06_STAY_PIVOT_CLEAN.mp4"),
            ("0_jlsrwgsp",44,70,"07_BOLTON_OPENER_CLEAN.mp4"),
            ("0_mgby2nzr",72,34,"08_DERBY_CREATION_CLEAN.mp4"),
            ("0_k2v6qd2y",50,72,"09_WREXHAM_GOAL_CELEBRATION_CLEAN.mp4"),
            ("0_jlsrwgsp",470,70,"10_BOLTON_WINNER_CLEAN.mp4"),
            ("0_4smjwnen",250,28,"11_WOLVES_ARMS_OUT_CLEAN.mp4"),
            ("0_anxhb73b",12,12,"12_PRAGUE_GOPRO_CLEAN.mp4"),
            ("0_8hp3sltc",35,9,"13_PRAGUE_MEMORY_CLEAN.mp4"),
            ("0_09bah7u5",0,12,"14_BOWEN_FRUSTRATION_INTERVIEW_CLEAN.mp4"),
          ]
          out=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={"width":1280,"height":720})
              for entry,start,dur,name in entries:
                  got={}
                  def cb(resp,entry=entry,got=got):
                      if f"api.playback.streamamg.com/v1/entry/{entry}" in resp.url:
                          try:
                              j=resp.json()
                              got["hls"]=j.get("media",{}).get("hls")
                              got["title"]=j.get("name")
                              got["source_duration"]=j.get("duration")
                          except Exception as e: got["error"]=repr(e)
                  page.on("response",cb)
                  page.goto(f"https://www.whufc.com/en/video/{entry}?provider=stream",wait_until="domcontentloaded",timeout=90000)
                  page.wait_for_timeout(2500)
                  if not got.get("hls"): page.wait_for_timeout(3500)
                  page.remove_listener("response",cb)
                  if not got.get("hls"): raise RuntimeError(f"No HLS {entry}: {got}")
                  out.append({"entry":entry,"start":start,"duration":dur,"outfile":name,**got})
                  print(entry,got.get("title"))
              b.close()
          open("sources_with_hls.json","w").write(json.dumps(out,indent=2))
          open("recovery_sources.json","w").write(json.dumps([{k:v for k,v in x.items() if k!="hls"} for x in out],indent=2))
          PY
      - name: Trim clean clips from official streams
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json,subprocess,concurrent.futures,os
          rows=json.load(open("sources_with_hls.json"))
          def run(r):
              # IMPORTANT: -ss is after -i. This avoids empty outputs from StreamAMG HLS input-side seeking.
              cmd=["ffmpeg","-hide_banner","-loglevel","error","-y",
                   "-i",r["hls"],"-ss",str(r["start"]),"-t",str(r["duration"]),
                   "-c:v","libx264","-preset","veryfast","-crf","17","-pix_fmt","yuv420p",
                   "-c:a","aac","-b:a","192k","-movflags","+faststart",r["outfile"]]
              subprocess.run(cmd,check=True)
              p=subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration:stream=codec_name,width,height","-of","json",r["outfile"]],text=True)
              j=json.loads(p)
              streams=j.get("streams",[])
              video=[s for s in streams if s.get("width")]
              dur=float(j.get("format",{}).get("duration",0) or 0)
              if not video or dur < float(r["duration"])-0.25:
                  raise RuntimeError(f"INVALID {r['outfile']} dur={dur} streams={streams}")
              open(r["outfile"]+".probe.json","w").write(p)
              return r["outfile"],dur,video[0].get("width"),video[0].get("height"),os.path.getsize(r["outfile"])
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              futs=[ex.submit(run,r) for r in rows]
              for f in concurrent.futures.as_completed(futs):
                  print("VERIFIED",f.result(),flush=True)
          PY
      - name: Package verified clean bank
        shell: bash
        run: |
          set -e
          sha256sum *_CLEAN.mp4 > CLEAN_SHA256SUMS.txt
          zip -q BOWEN_CLEAN_SOURCE_BANK.zip *_CLEAN.mp4 *.probe.json recovery_sources.json CLEAN_SHA256SUMS.txt
          unzip -t BOWEN_CLEAN_SOURCE_BANK.zip | tail -n 2
          ls -lh *_CLEAN.mp4 BOWEN_CLEAN_SOURCE_BANK.zip
      - name: Upload clean bank
        uses: actions/upload-artifact@v4
        with:
          name: bowen-clean-source-bank-v2
          path: BOWEN_CLEAN_SOURCE_BANK.zip
          retention-days: 1
