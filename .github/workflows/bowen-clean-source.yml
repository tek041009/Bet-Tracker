name: Bowen clean source probe
on:
  push:
    branches:
      - bowen-clean-source-20261001

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch StreamAMG playback JSON
        shell: bash
        run: |
          set -e
          curl -fsSL 'https://api.playback.streamamg.com/v1/entry/0_fwe57njw' -o playback.json
          echo '--- PLAYBACK JSON ---'
          cat playback.json
          echo
          echo '--- URLS ---'
          jq -r '.. | strings | select(test("^https?://"))' playback.json | tee playback_urls.txt
      - name: Fetch clean Newcastle clip
        shell: bash
        run: |
          set -e
          HLS=$(grep -Ei 'm3u8|manifest' playback_urls.txt | head -n1 || true)
          if [ -z "$HLS" ]; then
            HLS=$(grep -Ei 'https?://' playback_urls.txt | head -n1 || true)
          fi
          echo "SELECTED=$HLS" | tee selected_url.txt
          test -n "$HLS"
          ffmpeg -hide_banner -loglevel warning -y -ss 00:05:18 -i "$HLS" -t 18 -c:v libx264 -preset fast -crf 18 -c:a aac -b:a 192k 02_NEWCASTLE_CLEAN.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height -of json 02_NEWCASTLE_CLEAN.mp4 | tee clean_probe.json
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: bowen-clean-source-probe-2
          path: |
            playback.json
            playback_urls.txt
            selected_url.txt
            clean_probe.json
            02_NEWCASTLE_CLEAN.mp4
          retention-days: 1
