name: DARTS V2 data recovery
on:
  push:
    branches:
      - darts-v2-data-recovery
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract official format semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p darts_recovery
          python - <<'PY'
          import urllib.request, hashlib, pathlib, zipfile, re, html, xml.etree.ElementTree as ET
          out=pathlib.Path("darts_recovery")
          url="https://data.mendeley.com/public-files/datasets/cpzg7kw428/files/c4863545-da82-4d2d-ae8f-380c48673e23/file_downloaded"
          expected="e1997b356278657a75efbdafd7f265c6b7edde9fcb3fb98524c7dee8a456f930"
          zpath=out/"Data_and_code.zip"
          h=hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=180) as r, open(zpath,"wb") as f:
            while True:
              b=r.read(1024*1024)
              if not b: break
              f.write(b); h.update(b)
          if h.hexdigest()!=expected: raise SystemExit("archive hash mismatch")
          with zipfile.ZipFile(zpath) as z:
            run=z.read("Run.R").decode("utf-8",errors="replace")
            (out/"Run.R").write_text(run)
            guide=z.read("User guide to the code used for Paper.docx")
          (out/"guide.docx").write_bytes(guide)
          # Extract DOCX text.
          with zipfile.ZipFile(out/"guide.docx") as dz:
            xml=dz.read("word/document.xml")
          root=ET.fromstring(xml)
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          paras=[]
          for p in root.findall('.//w:p',ns):
            t=''.join(x.text or '' for x in p.findall('.//w:t',ns))
            if t.strip(): paras.append(t)
          guide_text="\n".join(paras)
          (out/"guide.txt").write_text(guide_text)
          # Print all lines around format/field construction.
          lines=run.splitlines()
          keys=re.compile(r'NumberofLegs|TotSets|Matchtype|Startfrom|Start\b|Win\b|GameNo|LegNo|SetNo|Timestamp|Win_poss_both',re.I)
          for i,line in enumerate(lines):
            if keys.search(line):
              a=max(0,i-3); b=min(len(lines),i+4)
              print(f"--- Run.R lines {a+1}-{b} ---")
              for j in range(a,b): print(f"{j+1}: {lines[j]}")
          print("=== GUIDE ===")
          print(guide_text)
          zpath.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: darts-v2-format-semantics
          path: darts_recovery/
          if-no-files-found: error
          retention-days: 3
