name: DARTS V2 data recovery
on:
  push:
    branches:
      - darts-v2-data-recovery
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect full official replication archive
        shell: bash
        run: |
          mkdir -p darts_recovery
          python - <<'PY'
          import urllib.request, hashlib, pathlib, zipfile, json, csv, io, re
          out=pathlib.Path("darts_recovery")
          url="https://data.mendeley.com/public-files/datasets/cpzg7kw428/files/c4863545-da82-4d2d-ae8f-380c48673e23/file_downloaded"
          zpath=out/"Data_and_code.zip"
          h=hashlib.sha256()
          total=0
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=120) as r, open(zpath,"wb") as f:
            while True:
              b=r.read(1024*1024)
              if not b: break
              f.write(b); h.update(b); total += len(b)
          digest=h.hexdigest()
          print("download_bytes", total)
          print("sha256", digest)
          expected="e1997b356278657a75efbdafd7f265c6b7edde9fcb3fb98524c7dee8a456f930"
          if digest != expected:
            raise SystemExit(f"SHA mismatch {digest} != {expected}")
          manifest=[]
          samples=[]
          with zipfile.ZipFile(zpath) as z:
            for info in z.infolist():
              manifest.append({"name":info.filename,"bytes":info.file_size,"compressed":info.compress_size})
            csv_names=[x["name"] for x in manifest if x["name"].lower().endswith(".csv")]
            print("csv_files", json.dumps(csv_names))
            targets=[n for n in csv_names if "international" in n.lower()]
            print("international_candidates", json.dumps(targets))
            for n in targets:
              with z.open(n) as fh:
                wrapper=io.TextIOWrapper(fh,encoding="utf-8-sig",errors="replace",newline="")
                reader=csv.reader(wrapper)
                rows=[]
                for i,row in enumerate(reader):
                  rows.append(row)
                  if i>=5: break
              samples.append({"name":n,"rows":rows})
              print("SAMPLE",n)
              for row in rows: print(json.dumps(row))
          (out/"archive_manifest.json").write_text(json.dumps(manifest,indent=2))
          (out/"international_samples.json").write_text(json.dumps(samples,indent=2))
          # Do not upload the 148MB archive; only audit metadata/samples.
          zpath.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: darts-v2-full-archive-inspection
          path: darts_recovery/
          if-no-files-found: error
          retention-days: 3
