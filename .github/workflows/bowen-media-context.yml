name: Bowen media context official podcast recovery
on:
  push:
    branches:
      - bowen-media-context-20261001

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Install open source audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q faster-whisper
      - name: Resolve official Sports Agents RSS episode
        shell: bash
        run: |
          set -e
          curl -fsSL 'https://feeds.captivate.fm/the-sports-agents/' -o feed.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET, html, json
          root=ET.parse('feed.xml').getroot()
          found=None
          for item in root.findall('.//item'):
              title=(item.findtext('title') or '').strip()
              if "Who's to blame for West Ham's relegation?" in title:
                  enc=item.find('enclosure')
                  found={'title':title,'url':enc.attrib.get('url') if enc is not None else None}
                  break
          if not found or not found['url']:
              raise SystemExit('episode not found')
          open('episode.json','w').write(json.dumps(found,indent=2))
          print(found['title'])
          print(found['url'])
          PY
          URL=$(python -c "import json; print(json.load(open('episode.json'))['url'])")
          curl -fL --retry 3 "$URL" -o episode.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 episode.mp3
          ffmpeg -hide_banner -loglevel error -y -i episode.mp3 -t 70 -ac 1 -ar 16000 intro70.wav
      - name: Locate Antonio Bowen quote with open source Whisper
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from faster_whisper import WhisperModel
          import json,re
          model=WhisperModel('tiny.en',device='cpu',compute_type='int8')
          segs,info=model.transcribe('intro70.wav',word_timestamps=True,beam_size=3)
          words=[]; text=[]
          for s in segs:
              text.append(s.text)
              for w in (s.words or []):
                  words.append({'word':w.word.strip(),'start':w.start,'end':w.end})
          open('intro_transcript.txt','w').write(' '.join(text))
          open('word_timestamps.json','w').write(json.dumps(words,indent=2))
          norm=lambda s:re.sub(r'[^a-z]','',s.lower())
          # Search from Jarrod/Jared through 'stop him'.
          start=None; end=None
          for i,w in enumerate(words):
              n=norm(w['word'])
              if start is None and n in ('jarrod','jared'):
                  # prefer the occurrence followed closely by 'wants'
                  look=[norm(x['word']) for x in words[i:i+5]]
                  if 'wants' in look:
                      start=max(0,w['start']-0.2)
              if start is not None and n=='him' and i>0 and norm(words[i-1]['word'])=='stop':
                  end=w['end']+0.25; break
          if start is None or end is None:
              # fallback: save the whole intro for manual localisation
              start,end=25,60
          open('cut.json','w').write(json.dumps({'start':start,'end':end},indent=2))
          print(open('intro_transcript.txt').read())
          print('CUT',start,end)
          PY
      - name: Cut verified Antonio excerpt
        shell: bash
        run: |
          set -e
          START=$(python -c "import json; print(json.load(open('cut.json'))['start'])")
          END=$(python -c "import json; print(json.load(open('cut.json'))['end'])")
          DUR=$(python -c "import json; d=json.load(open('cut.json')); print(d['end']-d['start'])")
          ffmpeg -hide_banner -loglevel error -y -ss "$START" -i episode.mp3 -t "$DUR" -ac 2 -ar 48000 -c:a pcm_s16le MEDIA03_ANTONIO.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 MEDIA03_ANTONIO.wav
          sha256sum MEDIA03_ANTONIO.wav > MEDIA03_SHA256SUM.txt
          zip -q BOWEN_ANTONIO_CONTEXT.zip MEDIA03_ANTONIO.wav MEDIA03_SHA256SUM.txt intro_transcript.txt word_timestamps.json cut.json episode.json
      - name: Upload Antonio context
        uses: actions/upload-artifact@v4
        with:
          name: bowen-antonio-context
          path: BOWEN_ANTONIO_CONTEXT.zip
          retention-days: 1
