name: PANNA player-ID-safe skills and weekly ratings
on:
  push:
    branches:
      - panna-datalayers-20261111
    paths:
      - .github/workflows/panna-weekly-skills-relay.yml
      - PANNA_WEEKLY_SKILLS_RECOVERY.py
permissions:
  contents: read
jobs:
  scoped-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [skills, epr_2025h2, epr_2026h1, epr_2026h2, psr_2025h2, psr_2026h1, psr_2026h2]
    env:
      PANNA_WEEKLY_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install parquet reader
        run: python -m pip install -q duckdb
      - name: Filter real weekly Panna ratings by original player IDs and as-of dates
        run: python PANNA_WEEKLY_SKILLS_RECOVERY.py
      - name: Upload source-provenance and exact filtered records
        uses: actions/upload-artifact@v4
        with:
          name: panna-weekly-${{ matrix.group }}
          path: panna_weekly_recovered/
          retention-days: 2
          compression-level: 0
