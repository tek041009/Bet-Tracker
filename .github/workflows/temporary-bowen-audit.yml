name: Temporary Bowen Portsmouth clip research
on:
  push:
    branches:
      - temporary/bowen-portsmouth-footage-audit-20261009
    paths:
      - .github/workflows/temporary-bowen-audit.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temporary/bowen-portsmouth-footage-audit-20261009
          persist-credentials: true
      - name: Install non-AI video inspection software
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --user --upgrade yt-dlp pillow
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Retrieve and sample source broadcasts
        run: python tmp_portsmouth_audit/micro_audit.py
      - name: Preserve source audit contact sheets on isolated research branch
        if: always()
        run: |
          git config user.name "Temporary footage research"
          git config user.email "research@users.noreply.github.com"
          git add tmp_portsmouth_audit
          git diff --cached --quiet || git commit -m "Footage comparison frame sheets and source status"
          git push origin HEAD:temporary/bowen-portsmouth-footage-audit-20261009
