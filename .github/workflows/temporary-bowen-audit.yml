name: Temporary Bowen silent clip artifact export
on:
  push:
    branches:
      - temporary/bowen-portsmouth-footage-audit-20261009
    paths:
      - .github/workflows/temporary-bowen-audit.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temporary/bowen-portsmouth-footage-audit-20261009
      - name: Verify rendered footage exists
        run: |
          ls -lh tmp_portsmouth_audit/PORTSMOUTH_ONLY_SIX_SHOTS_SILENT_PREVIEW.mp4
          test -s tmp_portsmouth_audit/PORTSMOUTH_ONLY_SIX_SHOTS_SILENT_PREVIEW.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Portsmouth_Silent_Six_Shots
          path: tmp_portsmouth_audit/PORTSMOUTH_ONLY_SIX_SHOTS_SILENT_PREVIEW.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
